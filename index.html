<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>浩然大六壬神课排盘</title>
<meta name="description" content="大六壬在线排盘：月将加时、天地盘、四课三传、十二天将、旬遁六亲、八煞神煞、十二长生，课经与毕法赋依《六壬大全》标注，手机电脑通用。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%23111111'/%3E%3Ctext x='16' y='23' font-size='19' text-anchor='middle' fill='%23fff' font-family='serif'%3E%E8%8E%9A%3C/text%3E%3C/svg%3E">
<style>
:root {
        --ink: #1b1a18; --red: #9c3232; --gray: #8d8680; --gray2: #a9a29b;
        --line: #ded3ce; --line2: #efe8e4;
    }
    * { box-sizing: border-box; }
    body { background: #fff; color: var(--ink); margin: 0;
           padding: 46px 20px 58px;
           font-family: "STSong", "Songti SC", "SimSun", "Songti TC", serif;
           -webkit-font-smoothing: antialiased; }
    .wrap { max-width: 860px; margin: 0 auto; }

    /* 标题 */
    .head { text-align: center; padding: 6px 0 26px; }
    .brand { display: flex; align-items: center; justify-content: center; gap: 20px;
             margin-bottom: 18px; }
    .bline { width: 84px; height: 1px; background: var(--line); }
    .btxt { font-size: 30px; letter-spacing: 18px; text-indent: 18px; color: var(--red);
            line-height: 1.1; }
    .title { font-size: 47px; letter-spacing: 24px; text-indent: 24px; line-height: 1.12;
             font-weight: 400; }
    .rule { margin: 24px auto 0; max-width: 860px; }
    .rule.top { margin: 0 auto 18px; max-width: 620px; opacity: .8; }
    .rule span { display: block; border-top: 1px solid var(--line); }
    .rule span + span { border-top: 1px solid var(--line2); margin-top: 3px; }

    /* 起课条 */
    .bar { display: flex; justify-content: center; align-items: baseline; gap: 18px; margin: 30px 0 40px; }
    .bar input[type=datetime-local] { font-family: inherit; font-size: 15px; color: var(--ink);
             background: transparent; border: none; border-bottom: 1px solid var(--line);
             padding: 3px 0 6px; outline: none; min-width: 216px; letter-spacing: .5px; }
    .bar button { font-family: inherit; font-size: 14px; letter-spacing: 5px; text-indent: 5px;
             color: var(--red); background: none; border: 1px solid var(--line);
             padding: 7px 20px; cursor: pointer; transition: .2s; }
    .bar button:hover { background: #fbf7f5; border-color: var(--red); }
    .bar input::-webkit-calendar-picker-indicator { opacity: .22; cursor: pointer; }

    /* 四柱 + 信息 */
    .meta { display: flex; justify-content: center; align-items: flex-start; gap: 38px; margin-bottom: 42px; }
    .pillars { display: flex; gap: 15px; }
    .pil { display: flex; flex-direction: column; align-items: center; }
    .pil .ph { font-size: 12.5px; color: var(--gray); letter-spacing: 3px; text-indent: 3px; margin-bottom: 8px; }
    .pil .pz { font-size: 30px; line-height: 1.16; }
    .vline { width: 1px; align-self: stretch; background: var(--line2); margin: 2px 2px 2px 0; }
    .mlines { font-size: 14.5px; line-height: 2.25; color: #3b3733; }
    .mlines .k { color: var(--gray); letter-spacing: 2px; }
    .mlines .g { color: var(--gray); }

    /* 三传：五列成组，干支大字居中于四课中线 */
    .chuan { display: grid;
             grid-template-columns: 46px 74px 108px 80px 40px;
             align-items: center; justify-content: center;
             column-gap: 6px; row-gap: 10px; max-width: 520px; margin: 0 auto 40px; }
    .cre { display: contents; }
    .cre .lab { color: var(--red); font-size: 13px; letter-spacing: 1px; text-align: center; }
    .cre .qn { color: var(--gray); font-size: 12px; letter-spacing: 0; text-align: center; }
    .cre .bz { font-size: 46px; line-height: 1.02; display: flex; align-items: flex-end;
               justify-content: center; white-space: nowrap; padding-bottom: 2px; }
    .cre .bz i { font-style: normal; font-size: 12px; color: #9c948d; margin-right: 5px;
                 vertical-align: text-top; line-height: 1.4; }
    .cre .kebz { display: none; }
    /* 朱圈：八煞单字 */
    .shas { display: flex; align-items: center; gap: 4px; justify-content: flex-start;
            min-height: 24px; }
    .sc { font-style: normal; display: inline-flex; align-items: center; justify-content: center;
          width: 21px; height: 21px; border: 1px solid rgba(156,50,50,.6); border-radius: 50%;
          color: var(--red); font-size: 12.5px; line-height: 1; letter-spacing: 0; }
    .gsh .sc { width: 24px; height: 24px; font-size: 13.5px; }
    /* 朱圈：课体名与法句 */
    .circ { border: 1px solid rgba(156,50,50,.5); border-radius: 999px; padding: 0 12px;
            display: inline-block; line-height: 1.7; }
    .cre .jj { color: #1e1b19; font-size: 21px; letter-spacing: 0; white-space: nowrap;
               line-height: 1.15; display: flex; flex-direction: column; align-items: center;
               justify-content: center; }
    .cre.first .bz { color: var(--red); }
    .cre.first .bz i { color: #c09a96; }

    /* 四课：四列等宽，逐行等高 */
    .ke { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); column-gap: 14px;
          max-width: 620px; margin: 0 auto 42px; }
    .kec { display: flex; flex-direction: column; align-items: center; width: 100%; }
    .kec .lab { height: 24px; display: flex; align-items: center; justify-content: center; gap: 4px;
                font-size: 12.5px; color: var(--gray); letter-spacing: 2px; }
    .kec .jj { height: 32px; display: flex; align-items: center; justify-content: center;
               font-size: 21px; color: #3a3531; letter-spacing: 0; }
    .kec .up { height: 58px; display: flex; align-items: center; justify-content: center;
               font-size: 47px; line-height: 1.1; }
    .kec .dn { height: 42px; display: flex; align-items: center; justify-content: center;
               font-size: 31px; line-height: 1.2; color: #3d3934; }
    .kec .nt { height: 20px; display: flex; align-items: center; justify-content: center;
               font-size: 11px; color: var(--gray2); letter-spacing: .5px; white-space: nowrap; }
    .kec.haske .nt { color: var(--red); opacity: .95; }
    .kec.yong .lab { color: var(--red); font-weight: normal; }
    .kec.yong .nt { color: var(--red); }
    .zs { font-style: normal; font-size: 10.5px; letter-spacing: 1px; margin-left: 3px;
          color: var(--gray2); vertical-align: 12px; }
    .zs1 { color: rgba(156,50,50,.8); }
    .bfq { font-size: 11px; color: var(--red); letter-spacing: 0; opacity: .9;
           white-space: nowrap; margin-top: 2px; font-weight: normal; }
    .kec .yb { font-style: normal; font-size: 11px; border: 1px solid var(--line);
               color: var(--red); padding: 0 3px; }
    .kec.yong .up, .kec.yong .dn { text-shadow: 0 0 .6px rgba(156,50,50,.35); }
    .kec.yong::after { content: ""; display: block; width: 62px; border-top: 1px solid rgba(156,50,50,.45);
                       margin-top: 8px; }

    /* 横向课盘：天地盘居左，三传在上、四课在下居右 */
    .board { display: grid; grid-template-columns: minmax(0, 1fr) 372px;
             column-gap: 26px; align-items: start; max-width: 860px; margin: 0 auto; }
    .br { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
    .bk { border-top: 1px solid var(--line2); margin: 0; }
    .board .ke, .board .chuan { max-width: none; margin: 0; }

    /* 天地盘：字均收在格内，格内左上角标十二长生 */
    .pan { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
           grid-template-rows: repeat(4, minmax(0, 1fr));
           aspect-ratio: 1 / 1; width: 100%;
           border: 1px solid var(--line); }
    .pc { border-right: 1px solid var(--line2); border-bottom: 1px solid var(--line2); min-width: 0;
          display: flex; flex-direction: column; justify-content: space-between; padding: 5px 8px; }
    .pc .jj { font-size: 40px; letter-spacing: 0; text-indent: 0; line-height: 1.2; color: #262220; text-align: center; }
    .pc .tz { flex: 1; display: flex; align-items: center; justify-content: center;
              font-size: 30px; line-height: 1; }
    .pc .dg { display: flex; justify-content: space-between; align-items: flex-end;
              font-size: 13px; color: #7b746d; letter-spacing: 1px; }
    .pc .dg .sha { color: var(--red); letter-spacing: 0; font-size: 12px; opacity: .92; }
    .pc { position: relative; }
    .pc .cs { position: absolute; left: 6px; top: 5px; font-style: normal;
              color: rgba(156, 50, 50, .88); font-size: 12px; letter-spacing: 0;
              line-height: 1; white-space: nowrap; }
    .pc.center { grid-column: 2 / 4; grid-row: 2 / 4; align-items: center; justify-content: center;
                 text-align: center; padding: 12px; border-right: 1px solid var(--line2);
                 border-bottom: 1px solid var(--line2); }
    .pc.center .rd { font-size: 14px; color: var(--gray); letter-spacing: 1.5px; line-height: 1.9; }
    .pc.center .kt { font-size: 30px; letter-spacing: 6px; text-indent: 5px; margin: 12px 0 10px; }
    .pc.center .kt em { font-style: normal; font-size: 15px; letter-spacing: 1px; color: var(--gray);
                        margin-left: 8px; }
    .pc.center .sub { font-size: 12px; color: var(--gray); line-height: 2.1; letter-spacing: .5px; }
    .pc.center .krow { display: flex; align-items: center; justify-content: center; gap: 7px;
                       font-size: 13px; letter-spacing: 1px; line-height: 1.5; margin-top: 4px;
                       flex-wrap: nowrap; }
    .pc.center .krow > * { flex: 0 0 auto; white-space: nowrap; }
    .pc.center .krow .circ { font-size: 13px; padding: 0 9px; line-height: 1.5; letter-spacing: .5px; }
    .pc.center .krow .fno { color: var(--gray); font-size: 11.5px; letter-spacing: 0; }

    /* 尾注 */
    .note { max-width: 700px; margin: 40px auto 0; padding-top: 24px; border-top: 1px solid var(--line);
            display: flex; flex-direction: column; gap: 14px; }
    .note .row { display: flex; gap: 18px; align-items: center; }
    
    .note .tag { flex: none; color: var(--red); font-size: 14px; letter-spacing: 6px; }
    .note .txt { flex: 1; color: #2f2b28; font-size: 21px; line-height: 1.9; letter-spacing: 2px; }
    .note .row.sub { margin-top: 4px; }
    .note .row.sub .tag { font-size: 12.5px; letter-spacing: 3px; padding-top: 3px; }
    .note .row.sub .txt { font-size: 14.5px; color: #7c746d; }
    .note .row.gap { margin-top: 14px; }

    /* 落款朱印 */
    .sign { display: flex; justify-content: flex-end; margin-top: 20px; }
    .seal { display: inline-flex; flex-direction: column; align-items: center;
            background: var(--red); color: #fff; border: 1px solid var(--red);
            padding: 5px 7px 6px; line-height: 1.25; font-size: 12.5px; letter-spacing: 2px;
            text-indent: 2px; opacity: .92; }

    @media (max-width: 640px) {
        body { padding: 12px 12px 16px; }
        .brand { gap: 9px; margin-bottom: 4px; }
        .bline { width: 30px; }
        .btxt { font-size: 14px; letter-spacing: 6px; text-indent: 6px; }
        .title { font-size: 20px; letter-spacing: 7px; text-indent: 7px; }
        .head { padding: 0 0 4px; }
        .rule.top { margin: 0 auto 5px; }
        .bar { margin: 5px 0 7px; gap: 6px; flex-wrap: nowrap; }
        .bar input[type=datetime-local] { min-width: 0; flex: 1 1 0%; width: auto; padding: 2px 0 4px;
                 font-size: 12px; letter-spacing: 0; }
        .bar button { flex: none; padding: 4px 8px; font-size: 11px; letter-spacing: 0;
                      text-indent: 0; }
        /* 四柱与信息并列，省一整块高度 */
        .meta { flex-direction: row; align-items: flex-start; justify-content: center;
                gap: 9px; margin-bottom: 8px; }
        .vline { display: block; }
        .pillars { gap: 8px; }
        .pil .ph { font-size: 9.5px; letter-spacing: 1px; text-indent: 1px; margin-bottom: 3px; }
        .pil .pz { font-size: 21px; line-height: 1.1; }
        .mlines { font-size: 9px; line-height: 1.45; letter-spacing: 0; text-align: left; }
        .mlines .k { letter-spacing: 0; }
        /* 三传 */
        .chuan { grid-template-columns: 18px 34px 84px 52px 50px;
                 column-gap: 3px; row-gap: 1px; margin-bottom: 9px; }
        .cre .bz { font-size: 22px; padding-bottom: 0; }
        .cre .bz i { font-size: 9px; margin-right: 2px; }
        .cre .jj { font-size: 14px; }
        .cre .lab { font-size: 10px; }
        .cre .qn { font-size: 9.5px; }
        .bfq { font-size: 8px; margin-top: 0; }
        .shas { gap: 2px; min-height: 14px; flex-wrap: wrap; align-items: center; }
        .sc { width: 14px; height: 14px; font-size: 9px; }
        /* 四课 */
        .ke { column-gap: 5px; margin-bottom: 9px; }
        .kec .lab { height: 13px; font-size: 9px; letter-spacing: 0; gap: 2px; }
        .kec .jj { height: 16px; font-size: 12px; }
        .kec .up { height: 23px; font-size: 22px; }
        .kec .dn { height: 18px; font-size: 16px; }
        .kec .nt { height: 12px; font-size: 8.5px; }
        .kec .yb { font-size: 8px; padding: 0 2px; }
        .kec.yong::after { width: 40px; margin-top: 2px; }
        /* 天地盘 */
        .pan { grid-template-rows: repeat(4, 74px); }
        .pc { padding: 3px 4px; }
        .pc .jj { font-size: 22px; line-height: 1.05; display: flex; align-items: center;
                  justify-content: center; }
        .pc .tz { font-size: 21px; }
        .pc .dg { position: relative; display: block; min-height: 16px; font-size: 9px;
                  letter-spacing: 0; }
        .pc .dg > span:first-child { position: absolute; right: 0; bottom: 0; }
        .pc .dg .shas { position: absolute; left: 0; bottom: 0; display: flex;
                         flex-wrap: wrap; gap: 1px 3px; justify-content: flex-start;
                         width: calc(100% - 12px); }
        .pc .dg .sha { font-size: 8.5px; }
        .pc .cs { left: 4px; top: 4px; font-size: 9.5px; }
        .gsh .sc { width: 17px; height: 17px; font-size: 10px; }
        .pc.center { padding: 4px 6px; }
        .pc.center .rd { font-size: 10px; line-height: 1.5; }
        .pc.center .kt { font-size: 17px; letter-spacing: 1px; margin: 4px 0 3px; }
        .pc.center .kt em { font-size: 10px; margin-left: 4px; }
        .pc.center .sub { font-size: 9.5px; line-height: 1.6; }
        .pc.center .krow { font-size: 10px; gap: 3px; margin-top: 3px; }
        .pc.center .krow .circ { font-size: 10px; padding: 0 6px; line-height: 1.4; }
        .pc.center .krow .fno { font-size: 8.5px; }
        /* 横向课盘退为单列：天地盘在上，三传、四课在下 */
        .board { grid-template-columns: minmax(0, 1fr); row-gap: 8px; }
        .pan { aspect-ratio: auto; }
        .br { gap: 8px; }
        .board .ke { margin-bottom: 0; }
        .bk { border-top: none; }
        .sign { margin-top: 2px; }
        .seal { padding: 2px 4px 3px; font-size: 9px; letter-spacing: 1px; text-indent: 1px; }
    }

    /* 在线版外壳 */
    .boot { max-width: 700px; margin: 60px auto; text-align: center; color: var(--gray);
            font-size: 14px; letter-spacing: 4px; line-height: 2.4; }
    .boot .dot { display: inline-block; width: 5px; height: 5px; border-radius: 50%;
                 background: var(--red); margin: 0 3px; animation: pul 1.2s infinite; }
    .boot .dot:nth-child(2) { animation-delay: .2s } .boot .dot:nth-child(3) { animation-delay: .4s }
    @keyframes pul { 0%,100% { opacity: .2 } 50% { opacity: 1 } }
    .bar .now { font-size: 13px; letter-spacing: 2px; text-indent: 2px; }

</style>
</head>
<body>
<div class="wrap">
    <div class="head">
        <div class="rule top"><span></span></div>
        <div class="brand"><span class="bline"></span><span class="btxt">浩然</span><span class="bline"></span></div>
        <div class="title">大六壬</div>
        <div class="rule"><span></span><span></span></div>
    </div>

    <form class="bar" id="bar" autocomplete="off">
        <input type="datetime-local" id="dt" step="1" min="1901-01-01T00:00" max="2100-12-31T23:59" required>
        <button type="submit">起课</button>
        <button type="button" class="now" id="now">此刻</button>
    </form>

    <div id="app"><div class="boot" id="boot">排盘<span class="dot"></span><span class="dot"></span><span class="dot"></span></div></div>

    <div class="sign"><span class="seal"><span>浩</span><span>然</span></span></div>
</div>

<script src="liuren.js"></script>
<script>
/* 起法口径（浩然定）：
   天乙贵人 —— 甲戊庚牛羊，乙己鼠猴乡，丙丁猪鸡位，壬癸兔蛇藏，六辛逢马虎。
   昼占：甲戊庚→丑、乙己→子、丙丁→亥、壬癸→卯、辛→午；
   夜占：甲戊庚→未、乙己→申、丙丁→酉、壬癸→巳、辛→寅。 */
(function(){
  var T = LR_DATA.GUI_TABLE;
  T["甲"] = ["丑", "未"];
  T["乙"] = ["子", "申"];
  T["丙"] = ["亥", "酉"];
  T["辛"] = ["午", "寅"];
  T["癸"] = ["卯", "巳"];
})();

const APP = document.getElementById('app');
const INP = document.getElementById('dt');

function pad(n){ return (n<10?'0':'')+n; }
function nowStr(){
  const d = new Date();
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds());
}

/* 横排课盘：天地盘居左，三传在上、四课在下居右 */
function layout(){
  const pan = APP.querySelector('.pan');
  const ke = APP.querySelector('.ke');
  const chuan = APP.querySelector('.chuan');
  if(!pan || !ke || !chuan) return;
  const meta = APP.querySelector('.meta');
  const board = document.createElement('div');
  board.className = 'board';
  const left = document.createElement('div');
  left.className = 'bl';
  left.appendChild(pan);
  const right = document.createElement('div');
  right.className = 'br';
  right.appendChild(chuan);
  const bk = document.createElement('div');
  bk.className = 'bk';
  right.appendChild(bk);
  right.appendChild(ke);
  board.appendChild(left);
  board.appendChild(right);
  if(meta) meta.parentNode.insertBefore(board, meta.nextSibling);
  else APP.appendChild(board);
}

/* 十二长生：以日干五行起长生，水土同宫（土从水，长生在申），五行同长生、顺行，
   不分阴干阳干。盘上标注四位：长生、沐浴、墓、绝；墓位与原有朱圈“墓”一致，
   遇已标则跳过，不重复。 */
const CS_ZHI = ["子","丑","寅","卯","辰","巳","午","未","申","酉","戌","亥"];
const CS_GAN_WX = {"甲":"木","乙":"木","丙":"火","丁":"火","戊":"土","己":"土","庚":"金","辛":"金","壬":"水","癸":"水"};
const CS_START = {"木":"亥","火":"寅","金":"巳","水":"申","土":"申"};
const CS_NAME = ["长生","沐浴","冠带","临官","帝旺","衰","病","死","墓","绝","胎","养"];
const CS_KEEP = {"长生":1,"沐浴":1,"绝":1};

function annotate(){
  const pan = APP.querySelector('.pan');
  const pil = APP.querySelectorAll('.pil');
  if(!pan || pil.length < 3) return;
  const gz = pil[2].querySelectorAll('.pz');
  const gan = gz.length ? gz[0].textContent.trim() : '';
  const wx = CS_GAN_WX[gan];
  if(!wx) return;
  const s0 = CS_ZHI.indexOf(CS_START[wx]);
  pan.querySelectorAll('.pc').forEach(c=>{
    if(c.classList.contains('center')) return;
    const tzEl = c.querySelector('.tz');
    if(!tzEl) return;
    const tian = tzEl.textContent.trim();
    const i = CS_ZHI.indexOf(tian);
    if(i < 0) return;
    const name = CS_NAME[((i - s0) % 12 + 12) % 12];
    if(!CS_KEEP[name]) return;
    if(c.querySelector('.cs')) return;
    const em = document.createElement('em');
    em.className = 'cs';
    em.textContent = name;
    c.appendChild(em);
  });
}

function draw(v){
  try{
    const r = LiuRen.render(v);
    APP.innerHTML = r.body;
    layout();
    annotate();
    INP.value = r.iso;
    document.title = '浩然大六壬神课排盘 ' + r.iso.replace('T',' ');
    history.replaceState(null, '', '?dt=' + r.iso);
  }catch(e){
    APP.innerHTML = '<div class="boot">排盘出错，请换个时刻重试</div>';
    console.error(e);
  }
}

const q = new URLSearchParams(location.search).get('dt');
INP.value = q || nowStr();
if (q) INP.value = q.replace(' ','T').slice(0,19);
document.getElementById('bar').addEventListener('submit', (ev)=>{ ev.preventDefault(); draw(INP.value); });
document.getElementById('now').addEventListener('click', ()=>{ INP.value = nowStr(); draw(INP.value); });
draw(INP.value);
</script>
</body>
</html>
